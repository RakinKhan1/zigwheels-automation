# Extent report, generated by the ExtentCucumberAdapter plugin in TestRunner.
# Without this file the adapter is on the classpath but writes no report.
extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-report/ExtentReport.html
extent.reporter.spark.vieworder=dashboard,test,category,exception,log

# Failure screenshots attached in Hooks are copied here and linked from the report
screenshot.dir=target/extent-report/screenshots/
screenshot.rel.path=screenshots/

systeminfo.Project=ZigWheels Automation - Case Study 2
systeminfo.Site=https://www.zigwheels.com
systeminfo.Browser=Chrome
systeminfo.Framework=Selenium + Cucumber + TestNG
